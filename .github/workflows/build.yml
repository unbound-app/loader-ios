name: Build Unbound
run-name: >-
  ${{
    inputs.only_app_repo == true && 'app-repo deploy' ||
    inputs.only_apt_repo == true && 'apt-repo deploy' ||
    format('{0} for {1}', (inputs.release == true && 'Release' || 'Build'), inputs.ipa_url)
  }}

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        default: ""
        description: "Direct link to the decrypted ipa"
        required: true
        type: string
      release:
        default: true
        description: "Create a GitHub release"
        type: boolean
      is_testflight:
        default: false
        description: "This is a TestFlight build"
        type: boolean
      add_extensions:
        default: true
        description: "Include extensions (OpenInDiscord & ShareToDiscord)"
        type: boolean
      only_app_repo:
        default: false
        description: "Build and deploy app-repo"
        type: boolean
      only_apt_repo:
        default: false
        description: "Build and deploy apt-repo"
        type: boolean
  workflow_call:
    inputs:
      ipa_url:
        default: ""
        type: string
      release:
        default: true
        type: boolean
      is_testflight:
        default: false
        type: boolean
      add_extensions:
        default: true
        type: boolean
      caller_workflow:
        type: string
    outputs:
      deb_url:
        description: "Download URL for the deb package artifact"
        value: ${{ jobs.build-tweak.outputs.deb_url }}
      ipa_url:
        description: "Download URL for the ipa file artifact"
        value: ${{ jobs.build-ipa.outputs.ipa_url }}
      simulator_url:
        description: "Download URL for the iOS Simulator zip artifact"
        value: ${{ jobs.build-simulator.outputs.simulator_url }}
      deb_filename:
        description: "Filename of the deb package"
        value: ${{ jobs.build-tweak.outputs.deb_filename }}
      ipa_filename:
        description: "Filename of the ipa file"
        value: ${{ jobs.build-ipa.outputs.ipa_filename }}
      simulator_filename:
        description: "Filename of the iOS Simulator zip"
        value: ${{ jobs.build-simulator.outputs.simulator_filename }}

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-tweak:
    if: &only_build_check inputs.only_app_repo != true && inputs.only_apt_repo != true
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      deb_url: ${{ steps.upload-deb.outputs.artifact-url }}
      deb_filename: ${{ steps.set-deb-filename.outputs.filename }}
    env:
      DEB_DOWNLOADED: false
      ATTESTATION_PK: ${{ secrets.ATTESTATION_PK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Download Tweak
        if: inputs.caller_workflow != 'ci'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            release_info=$(gh api --header 'Accept: application/vnd.github+json' "repos/${{ github.repository }}/releases/latest" 2>/dev/null || true)
            if [ -z "$release_info" ]; then
              if [ "$attempt" -lt 3 ]; then
                sleep 10
                continue
              fi
              echo "No release metadata was available after $attempt attempts"
              echo "DEB_DOWNLOADED=false" >> "$GITHUB_ENV"
              exit 0
            fi

            status_code=$(jq -r '.status // empty' <<< "$release_info")
            if [ -n "$status_code" ]; then
              if [ "$attempt" -lt 3 ]; then
                sleep 10
                continue
              fi
              echo "No releases found or request failed, status code: $status_code"
              echo "DEB_DOWNLOADED=false" >> "$GITHUB_ENV"
              exit 0
            fi

            release_version=$(jq -r '.assets[] | select(.name | contains("iphoneos-arm64.deb")) | .name' <<< "$release_info" | grep -o '_[0-9.]\+_' | tr -d '_' || true)
            control_version=$(grep '^Version:' control | cut -d ' ' -f 2)

            if [ "$release_version" != "$control_version" ]; then
              echo "Versions do not match. No files will be downloaded."
              echo "DEB_DOWNLOADED=false" >> "$GITHUB_ENV"
              exit 0
            fi

            mkdir -p packages
            download_failed=false
            while IFS= read -r asset_url; do
              if ! curl --fail --location --output "packages/$(basename "$asset_url")" "$asset_url"; then
                download_failed=true
                break
              fi
            done < <(jq -r '.assets[] | select(.name | endswith("arm64.deb")) | .browser_download_url' <<< "$release_info")

            if [ "$download_failed" = false ]; then
              echo "DEB_DOWNLOADED=true" >> "$GITHUB_ENV"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done
          echo "DEB download failed after 3 attempts"
          exit 1

      - name: Check cache
        if: env.DEB_DOWNLOADED == 'false'
        run: echo upstream_heads=`git ls-remote https://github.com/theos/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        if: env.DEB_DOWNLOADED == 'false'
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Trust Homebrew tap
        if: env.DEB_DOWNLOADED == 'false'
        run: |
          if brew tap | grep -Fxq 'aws/tap'; then
            brew trust aws/tap
          fi

      - name: Prepare Theos
        if: env.DEB_DOWNLOADED == 'false'
        uses: Randomblock1/theos-action@4e23d15886bca77b5f7c462a82567e0de33ebe0b

      - name: Build package
        if: env.DEB_DOWNLOADED == 'false'
        run: gmake package

      - name: Upload rootless package
        id: upload-deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rootless package
          path: packages/*.deb

      - name: Attest rootless package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: packages/*.deb

      - name: Set deb filename
        id: set-deb-filename
        run: |
          DEB_FILE=$(ls packages/*.deb)
          DEB_FILENAME=$(basename "$DEB_FILE")
          echo "filename=$DEB_FILENAME" >> $GITHUB_OUTPUT

  build-ipa:
    if: *only_build_check
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: build-tweak
    outputs:
      ipa_url: ${{ steps.upload-ipa.outputs.artifact-url }}
      ipa_filename: ${{ steps.set-ipa-filename.outputs.filename }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          set -euo pipefail
          selected_developer_dir=""
          for candidate in /Applications/Xcode_16.4.app /Applications/Xcode_16.4.0.app /Applications/Xcode.app; do
            if [ -x "$candidate/Contents/Developer/usr/bin/xcodebuild" ] && [ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | awk 'NR == 1 { print $2 }')" = "16.4" ]; then
              selected_developer_dir="$candidate/Contents/Developer"
              break
            fi
          done
          test -n "$selected_developer_dir"
          sudo xcode-select --switch "$selected_developer_dir"
          xcodebuild -version

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true

      - name: Download Discord ipa
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl --fail --location --output discord.ipa "$IPA_URL"; then
              exit 0
            fi
            rm -f discord.ipa
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          exit 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version: 'stable'

      - name: Clone patcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: unbound-app/patcher-ios
          path: patcher-ios

      - name: Build and run patcher
        run: |
          cd patcher-ios
          go build -o patcher
          ./patcher -i ../discord.ipa -o ../patched.ipa

      - name: Update ShareToDiscord Info.plist
        if: inputs.add_extensions == true
        run: |
          INFO_PLIST="extensions/ShareToDiscord/Share/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :URLScheme unbound" "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :URLScheme string unbound" "$INFO_PLIST"
          echo "Updated ShareToDiscord Info.plist - Changed URLScheme to 'unbound'"

      - name: Build Extensions
        if: inputs.add_extensions == true
        run: |
          if [ "${{ inputs.is_testflight }}" == true ]; then
            SAFARI_EXT_BUNDLE_ID="com.hammerandchisel.discord.testflight.OpenInDiscord"
            SHARE_EXT_BUNDLE_ID="com.hammerandchisel.discord.testflight.Share"
          else
            SAFARI_EXT_BUNDLE_ID="com.hammerandchisel.discord.OpenInDiscord"
            SHARE_EXT_BUNDLE_ID="com.hammerandchisel.discord.Share"
          fi
          
          cd extensions/OpenInDiscord
          xcodebuild build \
            -target "OpenInDiscord Extension" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="build" \
            PRODUCT_NAME="OpenInDiscord" \
            PRODUCT_BUNDLE_IDENTIFIER="$SAFARI_EXT_BUNDLE_ID" \
            PRODUCT_MODULE_NAME="OpenInDiscordExt" \
            SKIP_INSTALL=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | xcbeautify
          
          cd ../ShareToDiscord
          xcodebuild build \
            -target "Share" \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="build" \
            PRODUCT_NAME="Share" \
            PRODUCT_BUNDLE_IDENTIFIER="$SHARE_EXT_BUNDLE_ID" \
            PRODUCT_MODULE_NAME="Share" \
            SKIP_INSTALL=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO | xcbeautify
          cd ../../

      - name: Extract app name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Install cyan
        run: pip install --force-reinstall https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip Pillow

      - name: Inject tweak (and extensions)
        run: |
          if [ "${{ inputs.add_extensions }}" == true ]; then
            if [ "${{ inputs.is_testflight }}" == true ]; then
              cyan -duwsgq -b "com.hammerandchisel.discord.testflight" -i discord.ipa -o ${{ env.APP_NAME }}.ipa -f *.deb extensions/OpenInDiscord/build/OpenInDiscord.appex extensions/ShareToDiscord/build/Share.appex
            else
              cyan -duwsgq -i patched.ipa -o ${{ env.APP_NAME }}.ipa -f *.deb extensions/OpenInDiscord/build/OpenInDiscord.appex extensions/ShareToDiscord/build/Share.appex
            fi
          else
            if [ "${{ inputs.is_testflight }}" == true ]; then
              cyan -duwsgq -b "com.hammerandchisel.discord.testflight" -i discord.ipa -o ${{ env.APP_NAME }}.ipa -f *.deb
            else
              cyan -duwsgq -i patched.ipa -o ${{ env.APP_NAME }}.ipa -f *.deb
            fi
          fi

      - name: Upload ipa as artifact
        id: upload-ipa
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ipa
          path: ${{ env.APP_NAME }}.ipa

      - name: Attest IPA
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ env.APP_NAME }}.ipa

      - name: Set ipa filename
        id: set-ipa-filename
        run: echo "filename=${{ env.APP_NAME }}.ipa" >> $GITHUB_OUTPUT

  build-simulator:
    if: *only_build_check
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs: build-ipa
    env:
      ATTESTATION_PK: ${{ secrets.ATTESTATION_PK }}
    outputs:
      simulator_url: ${{ steps.upload-simulator.outputs.artifact-url }}
      simulator_filename: ${{ steps.set-simulator-filename.outputs.filename }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download ipa artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ipa

      - name: Extract app name
        run: |
          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          echo "APP_NAME=$NAME" >> $GITHUB_ENV

      - name: Extract IPA
        run: |
          unzip -q ${{ env.APP_NAME }}.ipa
          ls -la Payload/

      - name: Download simforge
        run: |
          curl -L -o simforge https://github.com/EthanArbuckle/simforge/releases/latest/download/simforge
          sudo chmod +x simforge

      - name: Convert for iOS Simulator
        run: |
          ./simforge convert Payload/Discord.app
          codesign -f -s - Payload/Discord.app/Frameworks/* || true
          codesign -f -s - Payload/Discord.app

      - name: Re-attest converted tweak
        run: |
          key_file=$(mktemp)
          expected_key=$(mktemp)
          actual_key=$(mktemp)
          expected_key_pem=$(mktemp)
          trap 'rm -f "$key_file" "$expected_key" "$actual_key" "$expected_key_pem"' EXIT
          printf "%s" "$ATTESTATION_PK" | tr -d '\r' > "$key_file"
          openssl base64 -d -A -in tools/attestation_public_key.b64 -out "$expected_key"
          openssl pkey -pubin -inform DER -in "$expected_key" -out "$expected_key_pem" 2>/dev/null
          openssl ec -in "$key_file" -pubout -outform DER -out "$actual_key" 2>/dev/null
          cmp -s "$expected_key" "$actual_key"
          commit_hash=$(git rev-parse HEAD)
          package_version=$(grep '^Version:' control | cut -d ' ' -f 2)
          dylib=$(find Payload/Discord.app -type f -name 'Unbound.dylib' -print -quit)
          test -n "$dylib"
          python3 tools/macho_attest.py sign "$dylib" --private-key "$key_file" --commit-hash "$commit_hash" --package-version "$package_version"
          codesign -f -s - "$dylib"
          python3 tools/macho_attest.py verify "$dylib" --public-key "$expected_key_pem"
          codesign -f -s - Payload/Discord.app

      - name: Create zip archive
        run: |
          cd Payload
          zip -r ../unbound-ios-simulator.zip Discord.app
          cd ..

      - name: Upload iOS Simulator artifact
        id: upload-simulator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator
          path: unbound-ios-simulator.zip

      - name: Attest iOS Simulator artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: unbound-ios-simulator.zip

      - name: Set simulator filename
        id: set-simulator-filename
        run: echo "filename=unbound-ios-simulator.zip" >> $GITHUB_OUTPUT

  release-app:
    if: inputs.caller_workflow != 'ci' && inputs.release == true && inputs.only_app_repo != true && inputs.only_apt_repo != true
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    needs: [build-tweak, build-ipa, build-simulator]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true

      - name: Extract Discord Version
        run: |
          unzip -q *.ipa
          VERSION=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleShortVersionString | cut -d '"' -f 4)
          
          if [[ "${{ inputs.is_testflight }}" == true ]]; then
            BUILD=$(plutil -p Payload/Discord.app/Info.plist | grep CFBundleVersion | cut -d '"' -f 4)
            VERSION="${VERSION}_${BUILD}"
          fi
          
          echo "DISCORD_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v${{ env.DISCORD_VERSION }}
          files: |
            ${{ needs.build-tweak.outputs.deb_filename }}
            ${{ needs.build-simulator.outputs.simulator_filename }}
            ${{ needs.build-ipa.outputs.ipa_filename }}
          generate_release_notes: true
          prerelease: ${{ inputs.is_testflight }}
          fail_on_unmatched_files: true
          token: ${{ env.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    if: |
      always() &&
      (
        inputs.only_app_repo == true ||
        inputs.only_apt_repo == true ||
        (inputs.caller_workflow != 'ci' && inputs.release == true && needs.release-app.result == 'success')
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-tweak, release-app]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      GPG_KEY: ${{ secrets.GPG_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download deb artifact
        if: inputs.only_app_repo != true && inputs.only_apt_repo != true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rootless package
          path: apt-repo/repo/debs

      - name: Download latest release deb
        if: inputs.only_apt_repo == true
        run: |
          mkdir -p apt-repo/repo/debs
          gh release download --repo ${{ github.repository }} --pattern '*arm64.deb' --dir apt-repo/repo/debs --clobber

      - name: Capture new deb filename
        if: inputs.only_app_repo != true
        run: echo "NEW_DEB_FILENAME=$(basename $(ls apt-repo/repo/debs/*.deb))" >> $GITHUB_ENV

      - name: Download ipa artifact
        if: inputs.only_app_repo != true && inputs.only_apt_repo != true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ipa

      - name: Download latest release ipa
        if: inputs.only_app_repo == true
        run: gh release download --repo ${{ github.repository }} --pattern '*.ipa' --clobber

      - name: Restore live site state
        run: |
          PACKAGE_ID=$(grep '^Package:' control | cut -d ' ' -f 2)
          mkdir -p "apt-repo/repo/depictions/web/$PACKAGE_ID" apt-repo/repo/debs
          cp app-repo.json apt-repo/repo/app-repo.json

          PAGES_URL=$(gh api "repos/${{ github.repository }}/pages" --jq '.html_url // empty')
          if [ -z "$PAGES_URL" ]; then
            echo "GitHub Pages not deployed yet, starting fresh"
            exit 0
          fi
          PAGES_URL="${PAGES_URL%/}"

          curl -fsSL "$PAGES_URL/app-repo.json" -o apt-repo/repo/app-repo.json.live \
            && mv apt-repo/repo/app-repo.json.live apt-repo/repo/app-repo.json \
            || echo "No live app-repo.json yet, using repo template"

          curl -fsSL "$PAGES_URL/depictions/web/$PACKAGE_ID/info.xml" -o "apt-repo/repo/depictions/web/$PACKAGE_ID/info.xml" \
            || echo "No live depiction yet, using repo template"

          if curl -fsSL "$PAGES_URL/Packages" -o previous-Packages; then
            grep '^Filename:' previous-Packages | awk '{print $2}' | sed 's|^\./||' | while read -r deb_path; do
              deb_name=$(basename "$deb_path")
              dest="apt-repo/repo/debs/$deb_name"
              if [ -f "$dest" ]; then
                continue
              fi
              echo "Restoring $deb_name"
              curl -fsSL "$PAGES_URL/$deb_path" -o "$dest" || echo "Warning: failed to restore $deb_name"
            done
            rm -f previous-Packages
          else
            echo "No live Packages file found, starting fresh"
          fi

      - name: Update app-repo.json
        if: inputs.only_apt_repo != true
        run: |
          APP_FILE=$(ls *.ipa)
          unzip -q "$APP_FILE"
          VERSION=$(python3 -c "import plistlib; print(plistlib.load(open('Payload/Discord.app/Info.plist','rb'))['CFBundleShortVersionString'])")

          if [[ "${{ inputs.is_testflight }}" == true ]]; then
            BUILD=$(python3 -c "import plistlib; print(plistlib.load(open('Payload/Discord.app/Info.plist','rb'))['CFBundleVersion'])")
            VERSION="${VERSION}_${BUILD}"
            APP_INDEX=1
          else
            APP_INDEX=0
          fi

          NAME=$(grep '^Name:' control | cut -d ' ' -f 2)
          DATE=$(date -u +"%Y-%m-%d")
          IPA_SIZE=$(stat -c%s "$APP_FILE")
          DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/v$VERSION/$NAME.ipa
          NEW_ENTRY=$(jq -n --arg version "$VERSION" --arg date "$DATE" --arg size "$IPA_SIZE" --arg downloadURL "$DOWNLOAD_URL" '{version: $version, date: $date, size: ($size | tonumber), downloadURL: $downloadURL, localizedDescription: "Further improvements to overall system stability and other minor adjustments have been made to enhance the user experience."}')

          VERSION_EXISTS=$(jq --arg version "$VERSION" --argjson index "$APP_INDEX" '.apps[$index].versions | map(select(.version == $version)) | length' apt-repo/repo/app-repo.json)
          if [ "$VERSION_EXISTS" -gt 0 ]; then
            jq --argjson newEntry "$NEW_ENTRY" --argjson index "$APP_INDEX" --arg version "$VERSION" '.apps[$index].versions |= map(if .version == $version then $newEntry else . end)' apt-repo/repo/app-repo.json > temp.json
          else
            jq --argjson newEntry "$NEW_ENTRY" --argjson index "$APP_INDEX" '.apps[$index].versions |= [$newEntry] + .' apt-repo/repo/app-repo.json > temp.json
          fi
          mv temp.json apt-repo/repo/app-repo.json

      - name: Update depiction version
        if: inputs.only_app_repo != true
        run: |
          DEB_FILE="apt-repo/repo/debs/${{ env.NEW_DEB_FILENAME }}"
          VERSION=$(dpkg-deb -f "$DEB_FILE" Version)
          PACKAGE_ID=$(dpkg-deb -f "$DEB_FILE" Package)

          INFO_XML="apt-repo/repo/depictions/web/$PACKAGE_ID/info.xml"
          if [ -f "$INFO_XML" ]; then
            sed -i "s|<version>.*</version>|<version>$VERSION</version>|" "$INFO_XML"
          else
            echo "Warning: no web depiction at $INFO_XML for $PACKAGE_ID"
          fi

      - name: Install apt-ftparchive & compressors
        run: sudo apt-get update && sudo apt-get install -y apt-utils xz-utils zstd bzip2 lz4 gzip gnupg

      - name: Import GPG key
        if: ${{ env.GPG_KEY != '' }}
        run: |
          echo "$GPG_KEY" | gpg --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | cut -d'/' -f2 | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Update repository
        working-directory: apt-repo
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
        run: |
          chmod +x update-repo.sh
          ./update-repo.sh

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apt-repo/repo
          retention-days: 90

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
