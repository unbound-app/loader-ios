name: Build Unbound
run-name: >-
  ${{
    inputs.only_app_repo == true && 'app-repo deploy' ||
    inputs.only_apt_repo == true && 'apt-repo deploy' ||
    format('{0} for {1}', (inputs.release == true && 'Release' || 'Build'), (inputs.version != '' && inputs.version || inputs.ipa_url != '' && inputs.ipa_url || 'latest stable'))
  }}

on:
  push:
    branches: [main, feat/monorepo]
  workflow_dispatch:
    inputs:
      version:
        default: ""
        description: "Discord app version"
        required: false
        type: string
      ipa_url:
        default: ""
        description: "Public direct IPA URL; leave empty to decrypt latest stable from dkrypt"
        required: false
        type: string
      is_testflight:
        default: false
        description: "Mark the selected iOS build as a TestFlight release"
        type: boolean
      authenticated_source:
        default: false
        description: "Authenticate direct IPA source downloads with the dkrypt API key"
        type: boolean
      dkrypt_base_url:
        default: "https://ipa.dylib.dev"
        description: "dkrypt service base URL"
        type: string
      release:
        default: true
        description: "Create a GitHub release"
        type: boolean
      only_app_repo:
        default: false
        description: "Build and deploy app-repo"
        type: boolean
      only_apt_repo:
        default: false
        description: "Build and deploy apt-repo"
        type: boolean
  workflow_call:
    inputs:
      version:
        default: ""
        type: string
      ipa_url:
        default: ""
        type: string
      release:
        default: false
        type: boolean
      is_testflight:
        default: false
        type: boolean
      authenticated_source:
        default: false
        type: boolean
      dkrypt_base_url:
        default: "https://ipa.dylib.dev"
        type: string
      only_app_repo:
        default: false
        type: boolean
      only_apt_repo:
        default: false
        type: boolean
      caller_workflow:
        default: ""
        type: string
    outputs:
      deb_url:
        description: "Download URL for the deb package artifact"
        value: ${{ jobs.ios.outputs.deb_url }}
      ipa_url:
        description: "Download URL for the ipa file artifact"
        value: ${{ jobs.ios.outputs.ipa_url }}
      simulator_url:
        description: "Download URL for the iOS Simulator zip artifact"
        value: ${{ jobs.ios.outputs.simulator_url }}
      deb_filename:
        description: "Filename of the deb package"
        value: ${{ jobs.ios.outputs.deb_filename }}
      ipa_filename:
        description: "Filename of the ipa file"
        value: ${{ jobs.ios.outputs.ipa_filename }}
      simulator_filename:
        description: "Filename of the iOS Simulator zip"
        value: ${{ jobs.ios.outputs.simulator_filename }}
      module_filename:
        description: "Filename of the Android LSPosed module APK"
        value: ${{ jobs.android.outputs.module_filename }}
      patched_filename:
        description: "Filename of the LSPatch-patched Discord package"
        value: ${{ jobs.android.outputs.patched_filename }}

permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve-source:
    if: inputs.only_app_repo != true && inputs.only_apt_repo != true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      is_testflight: ${{ steps.resolve.outputs.is_testflight }}
    steps:
      - name: checkout resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod

      - name: resolve source version
        id: resolve
        env:
          DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_IPA_URL: ${{ inputs.ipa_url }}
          INPUT_IS_TESTFLIGHT: ${{ inputs.is_testflight }}
          INPUT_AUTHENTICATED_SOURCE: ${{ inputs.authenticated_source }}
          INPUT_DKRYPT_BASE_URL: ${{ inputs.dkrypt_base_url || 'https://ipa.dylib.dev' }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_IPA_URL" ]; then
            go run ./tools fetch \
              --base-url "$INPUT_DKRYPT_BASE_URL" \
              --bundle-id com.hammerandchisel.discord \
              --version "$INPUT_VERSION" \
              --output source.ipa
          else
            channel=appstore
            if [ "$INPUT_IS_TESTFLIGHT" = true ]; then channel=testflight; fi
            fetch_args=(--base-url "$INPUT_DKRYPT_BASE_URL" --source-url "$INPUT_IPA_URL")
            if [ "$INPUT_AUTHENTICATED_SOURCE" = true ]; then fetch_args+=(--authenticated-source); fi
            fetch_args+=(--channel "$channel" --version "$INPUT_VERSION" --output source.ipa)
            go run ./tools fetch "${fetch_args[@]}"
          fi
          ipa_info=$(go run ./tools ipa-info --ipa source.ipa)
          version=$(jq -r '.version' <<< "$ipa_info")
          build=$(jq -r '.build' <<< "$ipa_info")
          release_version="$version"
          if [ "$INPUT_IS_TESTFLIGHT" = true ]; then release_version="${version}_${build}"; fi
          {
            echo "version=$version"
            echo "release_version=$release_version"
            echo "is_testflight=$INPUT_IS_TESTFLIGHT"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: resolve-source
    if: inputs.only_app_repo != true && inputs.only_apt_repo != true && needs.resolve-source.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ios_version: ${{ needs.resolve-source.outputs.version }}
      release: ${{ inputs.release || false }}
    secrets: inherit

  ios:
    needs: resolve-source
    if: always() && (inputs.only_app_repo == true || inputs.only_apt_repo == true || needs.resolve-source.result == 'success')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pages: write
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ inputs.version }}
      ipa_url: ${{ inputs.ipa_url }}
      release: ${{ inputs.release || false }}
      is_testflight: ${{ inputs.is_testflight || false }}
      authenticated_source: ${{ inputs.authenticated_source || false }}
      dkrypt_base_url: ${{ inputs.dkrypt_base_url || 'https://ipa.dylib.dev' }}
      only_app_repo: ${{ inputs.only_app_repo || false }}
      only_apt_repo: ${{ inputs.only_apt_repo || false }}
      caller_workflow: ${{ inputs.caller_workflow || '' }}
    secrets: inherit

  release:
    if: inputs.release == true && inputs.only_app_repo != true && inputs.only_apt_repo != true
    needs: [resolve-source, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download iOS tweak
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rootless package
          path: release-assets

      - name: download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ipa
          path: release-assets

      - name: download iOS simulator build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ios-simulator
          path: release-assets

      - name: download Android LSPosed module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: android module
          path: release-assets

      - name: download patched Android Discord package
        uses: actions/download-artifact@9000827ccba6bd643e8b6fd33ac0654aef8333
        with:
          name: patched discord
          path: release-assets

      - name: publish unified release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ needs.resolve-source.outputs.release_version }}
          files: |
            release-assets/${{ needs.ios.outputs.deb_filename }}
            release-assets/${{ needs.ios.outputs.ipa_filename }}
            release-assets/${{ needs.ios.outputs.simulator_filename }}
            release-assets/${{ needs.android.outputs.module_filename }}
            release-assets/${{ needs.android.outputs.patched_filename }}
          generate_release_notes: true
          prerelease: ${{ needs.resolve-source.outputs.is_testflight == 'true' }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}

  publish-app-repo:
    if: inputs.release == true && inputs.only_app_repo != true && inputs.only_apt_repo != true
    needs: [resolve-source, ios, android, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.resolve-source.outputs.release_version }}
      only_app_repo: true
      release: false
    secrets: inherit
