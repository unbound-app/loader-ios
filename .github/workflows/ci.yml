name: Pull Request Build

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

permissions:
    contents: read
    pull-requests: write
    id-token: write
    attestations: write
    artifact-metadata: write

jobs:
    validate-submodules:
        name: Validate submodules
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Verify submodule state
              run: |
                  set -euo pipefail
                  status="$(git submodule status --recursive)"
                  if printf '%s\n' "$status" | grep -Eq '^[+-U]'; then
                      printf '%s\n' "$status"
                      exit 1
                  fi
                  git submodule foreach --recursive 'git diff --exit-code'

    build:
        name: Build Unbound
        uses: ./.github/workflows/build.yml
        with:
            ipa_url: https://raw.githubusercontent.com/Tulugaak/Discord-205.0-IPA/4eec98e61e20d0720c091d42c4a762710b32e8c5/com.hammerandchisel.discord_861573261.ipa
            release: false
            caller_workflow: "ci"
        secrets: inherit

    compatibility-source:
        name: Check authorized compatibility source
        runs-on: ubuntu-latest
        outputs:
            available: ${{ steps.check.outputs.available }}
        steps:
            - name: Check source credentials
              id: check
              env:
                  DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}
              run: |
                  if [ -n "$DKRYPT_API_KEY" ]; then
                      echo 'available=true' >> "$GITHUB_OUTPUT"
                  else
                      echo 'available=false' >> "$GITHUB_OUTPUT"
                  fi

    compatibility:
        name: Discord ${{ matrix.version }} package smoke check
        needs: [build, compatibility-source]
        if: needs.compatibility-source.outputs.available == 'true'
        runs-on: macos-15
        strategy:
            fail-fast: false
            matrix:
                version: ['347.0', '341.0']
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  submodules: recursive

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              with:
                  cache: false
                  go-version-file: go.mod

            - name: Download built tweak
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: rootless package
                  path: packages

            - name: Fetch pinned Discord fixture
              env:
                  DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}
                  DISCORD_VERSION: ${{ matrix.version }}
              run: |
                  go run ./tools fetch --base-url https://ipa.dylib.dev --bundle-id com.hammerandchisel.discord --version "$DISCORD_VERSION" --output discord.ipa

            - name: Package compatibility IPA
              env:
                  DISCORD_VERSION: ${{ matrix.version }}
              run: |
                  go run ./tools build ipa --ipa discord.ipa --deb "$(find packages -maxdepth 1 -name '*.deb' -print -quit)" --channel appstore --output "discord-${DISCORD_VERSION}.ipa" --non-interactive

            - name: Upload package smoke artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: discord-${{ matrix.version }}-package-smoke
                  path: discord-${{ matrix.version }}.ipa

    comment-pr:
        name: Comment on PR
        runs-on: ubuntu-latest
        needs: build
        if: github.event_name == 'pull_request'
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 1

            - name: Delete existing comment
              uses: izhangzhihao/delete-comment@d075704468e1cf74e60944d9f335351213c34d85
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  delete_user_name: github-actions[bot]
                  issue_number: ${{ github.event.number }}

            - name: Get build info
              id: build-info
              run: |
                  COMMIT_HASH=$(git rev-parse --short HEAD)
                  BUILD_TIME=$(date "+%Y-%m-%d %H:%M:%S")

                  echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
                  echo "time=$BUILD_TIME" >> $GITHUB_OUTPUT

            - name: Comment on current PR
              uses: thollander/actions-comment-pull-request@e4a76dd2b0a3c2027c3fd84147a67c22ee4c90fa
              with:
                  message: |
                      **Commit**: [#${{ steps.build-info.outputs.hash }}](https://github.com/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
                      **Build Time**: `${{ steps.build-info.outputs.time }}`

                      #### Artifacts:
                      - [**${{ needs.build.outputs.deb_filename }}**](${{ needs.build.outputs.deb_url }})
                      - [**${{ needs.build.outputs.simulator_filename }}**](${{ needs.build.outputs.simulator_url }})
                      - [**${{ needs.build.outputs.ipa_filename }}**](${{ needs.build.outputs.ipa_url }})

                      Packaging and simulator artifacts are link/package checks, not Discord device-runtime validation.

                      <sub>This comment was automatically generated. [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
                  comment-tag: build-result
                  github-token: ${{ secrets.GITHUB_TOKEN }}
