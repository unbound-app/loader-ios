name: Poll Discord releases

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-release-poll-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stable-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod
      - name: resolve stable candidate
        id: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools release-candidate --channel stable

  testflight-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          cache: false
          go-version-file: go.mod
      - name: resolve TestFlight candidate
        id: candidate
        env:
          DKRYPT_API_KEY: ${{ secrets.DKRYPT_API_KEY }}
          DKRYPT_BASE_URL: ${{ vars.DKRYPT_BASE_URL || 'https://ipa.dylib.dev' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools release-candidate --channel testflight

  stable-release:
    needs: stable-candidate
    if: needs.stable-candidate.outputs.version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.stable-candidate.outputs.version }}
      release: true
      is_testflight: false
    secrets: inherit

  testflight-release:
    needs: testflight-candidate
    if: needs.testflight-candidate.outputs.version != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pages: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.testflight-candidate.outputs.version }}
      release: true
      is_testflight: true
    secrets: inherit
