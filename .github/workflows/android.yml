name: Build Android

on:
    push:
        branches: [main, feat/monorepo]
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:
    workflow_call:
        outputs:
            module_filename:
                description: "Filename of the LSPosed module APK"
                value: ${{ jobs.build-module.outputs.module_filename }}

permissions:
    contents: read

concurrency:
    group: android-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    core-tests:
        name: Shared core tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 1

            - name: Configure core
              run: cmake -S core -B build/core -DUNBOUND_CORE_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"

            - name: Build core
              run: cmake --build build/core -j"$(nproc)"

            - name: Run core tests
              run: ctest --test-dir build/core --output-on-failure

    build-module:
        name: Build LSPosed module
        runs-on: ubuntu-latest
        outputs:
            module_filename: ${{ steps.collect.outputs.module_filename }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  submodules: recursive
                  fetch-depth: 1

            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Install NDK and CMake
              run: |
                  set -eu
                  yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
                  "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" "platforms;android-36" > /dev/null

            - name: Build module
              working-directory: android
              run: ./gradlew :module:assembleRelease --no-daemon --console=plain

            - name: Collect module
              id: collect
              run: |
                  set -euo pipefail
                  version=$(grep '^Version:' ios/control | cut -d ' ' -f 2)
                  name="Unbound-Android-${version}.apk"
                  cp android/module/build/outputs/apk/release/module-release.apk "$name"
                  echo "module_filename=$name" >> "$GITHUB_OUTPUT"

            - name: Upload module
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: android module
                  path: ${{ steps.collect.outputs.module_filename }}

    patch-discord:
        name: Build patched Discord APK
        needs: build-module
        runs-on: ubuntu-latest
        env:
            LSPATCH_VERSION: v1.2
            LSPATCH_JAR: lspatch-v1.2-487-release.jar
            LSPATCH_SHA256: d238fdc414d121b7fa454d8b4ccf420df3a8c97d563761861ff92bd9c5da2165
            DISCORD_CERT_SHA256: 3c39d23cf9367849a5c699395647fe0e5bfea5a1f1f40d8c717ddc70f8bfa113
            DISCORD_TRACKER: https://tracker.vendetta.rocks/tracker
        steps:
            - name: Setup Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
              with:
                  distribution: temurin
                  java-version: "21"

            - name: Download module
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
              with:
                  name: android module
                  path: module

            - name: Download LSPatch
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  gh release download "$LSPATCH_VERSION" -R JingMatrix/LSPatch -p "$LSPATCH_JAR"
                  echo "$LSPATCH_SHA256  $LSPATCH_JAR" | sha256sum -c -

            - name: Download Discord
              id: discord
              run: |
                  set -euo pipefail
                  version=$(curl -fsSL "$DISCORD_TRACKER/index" | jq -r '.latest.stable')
                  mkdir discord
                  for split in base config.arm64_v8a config.armeabi_v7a config.xxhdpi config.en; do
                      curl -fsSL -o "discord/$split.apk" "$DISCORD_TRACKER/download/$version/$split"
                  done
                  apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
                  for apk in discord/*.apk; do
                      certificates=$("$apksigner" verify --print-certs "$apk")
                      if ! grep -Eq "^(V[0-9.]+ )?Signer( #1)?:? certificate SHA-256 digest: $DISCORD_CERT_SHA256" <<< "$certificates"; then
                          echo "::error::$apk is not signed by Discord"
                          exit 1
                      fi
                  done
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Patch Discord
              id: patch
              run: |
                  set -euo pipefail
                  mkdir patched
                  java -jar "$LSPATCH_JAR" discord/*.apk -m module/*.apk -l 2 -o patched -f
                  name="Unbound-Discord-${{ steps.discord.outputs.version }}.apks"
                  (cd patched && zip -q "../$name" *.apk)
                  echo "patched_filename=$name" >> "$GITHUB_OUTPUT"

            - name: Upload patched Discord
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: patched discord
                  path: ${{ steps.patch.outputs.patched_filename }}
